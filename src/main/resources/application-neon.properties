# Da usare insieme a "demo" (SPRING_PROFILES_ACTIVE=demo,neon) per puntare la demo a un PostgreSQL
# esterno su Neon invece di H2 in memoria. DB_URL, DB_USERNAME e DB_PASSWORD arrivano dall'ambiente:
# DB_URL nel formato jdbc:postgresql://HOST/DATABASE con l'host diretto (senza "-pooler"): Neon
# sconsiglia il pooler PgBouncer per le migrazioni Flyway e la demo usa poche connessioni.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# TLS obbligatorio e verificato: certificato del server validato con il truststore di Java (Neon usa
# una CA pubblica) e nome host controllato. Fissato qui, non dipende dai parametri scritti in DB_URL.
spring.datasource.hikari.data-source-properties.sslmode=verify-full
spring.datasource.hikari.data-source-properties.sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory
spring.datasource.hikari.data-source-properties.channelBinding=require
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
# Neon si spegne dopo qualche minuto senza connessioni e non consuma ore di calcolo del piano Free:
# nessuna connessione tenuta aperta a riposo, chiusa dopo 60 secondi di inattività.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
# Al risveglio Neon impiega qualche centinaio di millisecondi: margine sul timeout di connessione.
spring.datasource.hikari.connection-timeout=15000
app.registration-enabled=${REGISTRATION_ENABLED:false}
