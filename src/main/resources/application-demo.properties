# Dietro il proxy di Render l'IP del client arriva in X-Forwarded-For: serve al rate limiting per IP.
# "native" lascia a Tomcat il compito di fidarsi dell'header solo se arriva da un proxy interno.
server.forward-headers-strategy=native
app.cookie-secure=true
app.require-auth-origin=true
app.registration-enabled=${REGISTRATION_ENABLED:false}
app.mail.provider=${MAIL_PROVIDER:disabled}
app.demo-password=${DEMO_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.data-source-properties.sslMode=VERIFY_IDENTITY
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=file:/tmp/aiven-truststore.p12
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=PKCS12
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=changeit
spring.datasource.hikari.data-source-properties.fallbackToSystemTrustStore=false

