# Dietro il proxy di Render l'IP del client arriva in X-Forwarded-For: serve al rate limiting per IP.
# "native" lascia a Tomcat il compito di fidarsi dell'header solo se arriva da un proxy interno.
server.forward-headers-strategy=native
# URL pubblico del backend su Render: permette il "Try it out" della Swagger UI (vedi AuthOriginFilter).
app.api-public-url=${API_PUBLIC_URL:https://expense-tracker-api-demo-plb9.onrender.com}
app.cookie-secure=true
app.require-auth-origin=true
# Con il database in memoria gli account creati sparirebbero al riavvio: la registrazione resta chiusa
# anche se REGISTRATION_ENABLED=true è ancora impostata sul servizio (il profilo "aiven" la riapre).
app.registration-enabled=false
app.mail.provider=${MAIL_PROVIDER:disabled}
app.demo-password=${DEMO_PASSWORD}
# Database in memoria (H2): la demo non dipende da un database esterno e non ha costi.
# Lo schema lo crea Hibernate all'avvio (le migrazioni Flyway sono scritte per MySQL) e
# DemoDataInitializer ricrea l'account condiviso con i dati di esempio. I dati aggiunti dai
# visitatori si perdono quando il servizio si riavvia. Per usare un MySQL vero: profilo "aiven".
spring.datasource.url=jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
