spring.application.name=expense-tracker-api
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms
spring.data.redis.repositories.enabled=false
app.cache.expenses-enabled=${EXPENSE_CACHE_ENABLED:true}

#MYSQL

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/expense-tracker}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

#JACKSON

spring.jackson.deserialization.fail-on-unknown-properties=false
jwt.secret=${SECRET_KEY}
#MAIL
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.frontend-url=${FRONTEND_URL:http://localhost:4200}


server.port=${PORT:8080}
app.cookie-secure=${COOKIE_SECURE:false}
app.cookie-same-site=Strict
app.require-auth-origin=${REQUIRE_AUTH_ORIGIN:false}
app.registration-enabled=${REGISTRATION_ENABLED:true}


# smtp locally; brevo uses HTTPS in the deployed environment
app.mail.provider=${MAIL_PROVIDER:smtp}
app.mail.from=${MAIL_FROM:noreply@expense-tracker.local}
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.from-name=${MAIL_FROM_NAME:Gestionale Spese}
app.mail.connect-timeout-ms=5000
app.mail.read-timeout-ms=10000
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
