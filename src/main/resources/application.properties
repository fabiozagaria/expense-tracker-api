spring.application.name=expense-tracker-api
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms
spring.data.redis.repositories.enabled=false
app.cache.expenses-enabled=${EXPENSE_CACHE_ENABLED:true}

#MYSQL

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/expense-tracker}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
# Lo schema è gestito da Flyway (db/migration); Hibernate si limita a verificarlo all'avvio.
spring.jpa.hibernate.ddl-auto=validate
# Database esistenti (creati da Hibernate prima di Flyway): vengono marcati alla versione 1
# senza rieseguire V1; vengono applicate solo le migrazioni successive.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

#JACKSON

spring.jackson.deserialization.fail-on-unknown-properties=false
jwt.secret=${SECRET_KEY}
#MAIL
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.frontend-url=${FRONTEND_URL:http://localhost:4200}


# OpenAPI (/v3/api-docs) e Swagger UI (/swagger-ui.html). SWAGGER_ENABLED=false li spegne entrambi.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.operations-sorter=method
# Filtrata da Maven (@..@): è la versione del pom, mostrata nella documentazione.
app.version=@project.version@

# Limite di richieste per IP sugli endpoint pubblici /auth (soglie in RateLimitPolicy). RATE_LIMIT_ENABLED=false lo spegne.
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}

server.port=${PORT:8080}
app.cookie-secure=${COOKIE_SECURE:false}
app.cookie-same-site=Strict
app.require-auth-origin=${REQUIRE_AUTH_ORIGIN:false}
app.registration-enabled=${REGISTRATION_ENABLED:true}


# smtp locally; brevo uses HTTPS in the deployed environment
app.mail.provider=${MAIL_PROVIDER:smtp}
app.mail.from=${MAIL_FROM:noreply@expense-tracker.local}
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.from-name=${MAIL_FROM_NAME:Gestionale Spese}
app.mail.connect-timeout-ms=5000
app.mail.read-timeout-ms=10000
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
