name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers avvia MySQL da solo: il runner ha già Docker.
      - name: Maven verify
        run: ./mvnw -B verify

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Intercetta Dockerfile rotti (es. nome del jar) prima che arrivino al deploy.
      - name: Build image
        run: docker build --tag expense-tracker-api:ci .
